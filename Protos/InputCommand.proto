syntax = "proto3";

message InputCommand {
  int64 sequence_number = 1;
  float horizontal = 2;
  float vertical = 3;
  bool jump = 4;
  int32 ability_id = 6;
  // 자세 축 — 0이면 대자, 1이면 다이브. 사이는 연속이다.
  float posture = 7;
  // 패러세일을 펴고 있나. 자세 축과 무관한 별개 도구다.
  bool glide = 8;
  // 자세 슬라이더를 잡고 있나. 자세 값(posture/glide)만으로는 "안 잡음"과
  // "잡았는데 대자"를 구분할 수 없어서 따로 싣는다 — 그 구분이 스카이다이빙 진입 조건이다.
  bool posing = 9;
  // Flappy: 대시 버튼. 누른 틱에만 참인 이산 액션이다(jump와 같은 짝).
  bool dash = 10;
  // Archery: 좌우 조준 각도(도). 카메라가 보는 방향을 그대로 싣는다.
  float aim_yaw = 11;
  // Archery: 위아래 조준 각도(도). 양수면 위를 본다.
  float aim_pitch = 12;
  // Archery: 활을 당기고 있나. 손가락을 대고 있는 동안 참인 연속 값.
  bool drawing = 13;
  // Archery: 손을 뗀 틱에만 참인 이산 액션(jump와 같은 짝).
  bool release = 14;
  // Archery: 당김 목표(0 또는 1) — 손가락을 대고 있는 동안 1을 보낸다. 더 이상 끈 거리가
  // 아니다. 실제 당김 정도와 화살 속도는 이 목표를 향해 시뮬이 정해진 속도로 램프업하며
  // 걸린 틱 수(=시간)로 정해진다. 서버는 이 값을 그대로 믿지 않고 0~1로 clamp한다 —
  // 클라가 임의 크기를 실어도 결과는 시간으로만 정해지게 하기 위함이다.
  float draw_ratio = 15;
}