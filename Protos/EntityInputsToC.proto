syntax = "proto3";

import "InputCommandToS.proto";

// 한 새의 최근 입력들. entity_id로 누구 것인지 가른다.
// (필드 타입 — wire 직접 전송 안 함, 자동 생성 마커 없음 → MessageId 없음)
message EntityInputHistory
{
	string entity_id = 1;
	// 틱+커맨드 짝은 클라→서버(InputCommandToS)가 쓰는 타입을 그대로 재사용한다 —
	// 같은 것을 두 이름으로 만들면 한쪽만 고치는 사고가 난다.
	repeated InputCommandEntry recent_inputs = 2;
}

// 서버가 각 새의 입력을 모두에게 되뿌린다. 받는 클라는 자기 것은 버리고(이미 갖고 있다)
// 남의 것만 자기 InputBuffer에 넣어, 남의 새도 진짜 입력으로 굴린다.
//
// unreliable + 최근 N틱 묶음(sliding-window redundancy) — 클라→서버가 쓰는 방식과 같다.
// 한 패킷을 잃어도 다음 패킷이 그 틱을 다시 실어 오므로 스스로 메워진다.
// @auto_generate
message EntityInputsToC
{
	int64 tick = 1;
	repeated EntityInputHistory entities = 2;
}
