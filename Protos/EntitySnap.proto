syntax = "proto3";
import "ProtoVector3.proto";
import "ProtoMotionContribution.proto";
import "ProtoActiveEffect.proto";
message EntitySnap
{
	string entity_id = 1;
	ProtoVector3 position = 2;
	ProtoVector3 rotation = 3;
	ProtoVector3 velocity = 4;
	int32 max_HP = 5;
	int32 current_HP = 6;
	repeated ProtoMotionContribution motion_contributions = 7;
	bool grounded = 8;
	int32 active_ability_id = 9;    // 0 = 시전 중 아님
	int64 ability_end_tick  = 10;   // 시전이 끝나는 절대 틱(= RecoveryEndTick)
	repeated ProtoActiveEffect status_effects = 11;
	reserved 12, 13;                // 옛 bool stunned / invulnerable — 남은 시간을 못 담아 은퇴
	int64 stun_end_tick = 14;       // Flappy: 멈춤이 풀리는 절대 틱. 0 = 안 멈춤
	int64 invuln_end_tick = 15;     // Flappy: 다시 안 걸리는 구간이 끝나는 절대 틱. 0 = 아님
	float posture_axis = 16;        // Skydive: 0 = 대자, 1 = 다이브
	bool gliding = 17;              // Skydive: 패러세일을 폈나
	float stamina = 18;             // Skydive: 남은 활공 자원
	// 초 단위 남은 시간 그대로 싣는다(끝나는 절대 틱이 아니다) — Stamina 컴포넌트가 원래
	// 초로 들고 있어(EmergencyRemaining), 틱으로 왕복 변환하면 반올림 손실이 생긴다.
	// 또 이 값은 항상 스냅을 만든 그 틱에서 곧바로 적용되니(앵커 틱 그대로, 되감기 재생 전),
	// 절대 틱 방식이 막아 주는 "늦게 도착해서 낡아 보이는" 문제 자체가 없다.
	float emergency_remaining = 19; // Skydive: 잔고 0에서 쓴 "마지막 한 번" 구제 창의 남은 초
	int64 dash_end_tick = 20;       // Flappy: 대시가 끝나는 절대 틱. 0 = 대시 중 아님
	float dash_charge = 21;         // Flappy: 대시 게이지 0~1. 발동 자격의 권위다
	// 순간이동한 횟수. 받는 쪽은 직전에 본 값과 다른지만 본다 — 스냅샷이 유실돼도
	// 다음 스냅샷에서 알아챈다(일회성 표시라면 그 패킷과 함께 사라진다).
	int32 teleport_count = 22;
}
