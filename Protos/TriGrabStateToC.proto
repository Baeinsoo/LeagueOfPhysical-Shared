syntax = "proto3";

// 삼색 그랩 카드 한 장. 도는 카드의 지금 색은 (ink + 지난 주기 수) % 3 로 양쪽이 같이 계산한다.
message TriGrabCardWire
{
	int32 id = 1;
	int32 word = 2;
	int32 ink = 3;
	bool cycles = 4;
	int32 period_ticks = 5;
	int64 t0_tick = 6;
	// 3차: 카드 모양 0 원 · 1 세모 · 2 네모. word는 0~2 색 이름, 3~5 모양 이름.
	int32 shape = 7;
}

// 회전판 슬롯 하나. card가 없으면 빈 슬롯.
message TriGrabSlotWire
{
	TriGrabCardWire card = 1;
	int64 empty_until_tick = 2;
}

// 나가 있는 갈고리 하나. 길이·끝 자리는 틱을 넣어 양쪽이 같은 식으로 계산한다.
message TriGrabHookWire
{
	string owner_id = 1;
	int64 fire_tick = 2;
	float origin_x = 3;
	float origin_z = 4;
	float dir_x = 5;
	float dir_z = 6;
	int64 turn_tick = 7;
	float turn_length = 8;
	TriGrabCardWire carried = 9;
	// 0 = 아직 없음, 1 = 정답, 2 = 오답
	int32 result = 10;
	int64 end_tick = 11;
}

message TriGrabPlayerWire
{
	string entity_id = 1;
	int32 score = 2;
	int32 mistakes = 3;
	int64 reload_until_tick = 4;
	int32 best_rt_ms = 5;
	// 이번 라운드에 몇 번째로 정답을 냈나(0 = 아직). score는 판 전체 누적이다.
	int32 round_place = 6;
	int32 round_points = 7;
}

// 삼색 그랩 판 상태 전체(서버 → 클라). 바뀔 때만 reliable로 간다.
// 카드·회전판은 틱을 넣어 계산하므로 틱마다 보내지 않는다.
// @auto_generate
message TriGrabStateToC
{
	// 받는 쪽은 자기가 가진 판본보다 작으면 버린다(늦게 도착한 낡은 소식).
	int32 version = 1;
	int32 phase = 2;
	int64 phase_end_tick = 3;
	int32 round = 4;
	int32 rule_type = 5;
	int32 rule_color = 6;
	float base_angle0 = 7;
	float omega = 8;
	int64 live_start_tick = 9;
	int64 freeze_tick = 10;
	repeated TriGrabSlotWire slots = 11;
	repeated TriGrabHookWire hooks = 12;
	repeated TriGrabPlayerWire players = 13;
	string round_winner_id = 14;
	// 2차부터 쓰지 않는다(목표 점수 없이 5라운드 누적). 번호는 다시 쓰지 않는다.
	int32 target_score = 15;
	string match_winner_id = 16;
	int32 total_rounds = 17;
	// 이번 라운드 Live의 시간 상한 틱.
	int64 round_limit_tick = 18;
	// 3차 주문 확장. rule_type 3 = 모양, 4 = 글자와 모양이 같음. 아래 둘은 +1 해서 싣는다(0 = 없음).
	int32 rule_shape_plus1 = 19;
	bool rule_negate = 20;
	int32 rule_decoy_ink_plus1 = 21;
}
